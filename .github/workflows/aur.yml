name: AUR

# Publishes kocr-bin (CLI) and kocr-gui-bin (GUI) once a release is out.
#
# Needs the repository secret AUR_SSH_PRIVATE_KEY: an SSH key registered with
# the AUR account that owns kocr-bin.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.5.0
        required: true
        type: string

concurrency:
  group: aur
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the AUR packages
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Resolve the release tag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Could not resolve a release tag (got '$tag')" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Wait for the release assets
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for name in \
            "kocr-cli-${VERSION}-linux-amd64.tar.gz" \
            "kocr-${VERSION}-linux-amd64.tar.gz" \
            "kocr-cli-${VERSION}-linux-arm64.tar.gz" \
            "kocr-${VERSION}-linux-arm64.tar.gz"; do
            for _ in $(seq 1 30); do
              curl -fsSIL -o /dev/null "$base/$name" && continue 2
              sleep 10
            done
            echo "Missing release asset: $name" >&2
            exit 1
          done

      - name: Set the version and checksums
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          sum() {
            local hash
            hash="$(curl -fsSL "$base/$1.sha256" | awk '{ print $1 }')"
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "No checksum for $1" >&2
              exit 1
            fi
            printf '%s' "$hash"
          }
          for pkg in kocr-bin kocr-gui-bin; do
            case "$pkg" in
              kocr-bin)
                amd64="kocr-cli-${VERSION}-linux-amd64.tar.gz"
                arm64="kocr-cli-${VERSION}-linux-arm64.tar.gz"
                ;;
              kocr-gui-bin)
                amd64="kocr-${VERSION}-linux-amd64.tar.gz"
                arm64="kocr-${VERSION}-linux-arm64.tar.gz"
                ;;
            esac
            dir="packaging/linux/${pkg}"
            sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "$dir/PKGBUILD"
            sed -i "s/^pkgrel=.*/pkgrel=1/" "$dir/PKGBUILD"
            sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('$(sum "$amd64")')|" "$dir/PKGBUILD"
            sed -i "s|^sha256sums_aarch64=.*|sha256sums_aarch64=('$(sum "$arm64")')|" "$dir/PKGBUILD"
          done

      - name: Write .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/packaging/linux:/pkgs" \
            -w /pkgs \
            archlinux:base-devel \
            bash -euc '
              useradd -m builder
              chown -R builder /pkgs
              for dir in kocr-bin kocr-gui-bin; do
                su builder -c "cd /pkgs/$dir && makepkg --printsrcinfo > .SRCINFO"
              done
            '

      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          for pkg in kocr-bin kocr-gui-bin; do
            dir="packaging/linux/${pkg}"
            clone="$(mktemp -d)"
            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "$clone"
            cp "$dir/PKGBUILD" "$dir/.SRCINFO" "$clone/"
            (
              cd "$clone"
              git config user.name "${GITHUB_ACTOR}"
              git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
              git add PKGBUILD .SRCINFO
              if git diff --cached --quiet; then
                echo "${pkg} is already at ${TAG}."
              else
                git commit -m "update to ${TAG}"
                git push origin master
              fi
            )
          done
