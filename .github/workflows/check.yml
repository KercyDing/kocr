name: Check

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Build
        run: zig build -Doptimize=debug

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Test
        run: zig build test

      - name: Build CLI
        run: zig build cli -Doptimize=debug

      - name: Build GUI
        run: zig build gui -Doptimize=debug
