name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
            key: linux
            deps: true
            fmt: true
          - platform: macos-15
            name: macOS ARM64
            key: macos-arm64
            deps: false
            fmt: false
          - platform: macos-15-intel
            name: macOS x64
            key: macos-x64
            deps: false
            fmt: false
          - platform: windows-latest
            name: Windows x64
            key: windows-x64
            deps: false
            fmt: false
          - platform: windows-11-arm
            name: Windows ARM64
            key: windows-arm64
            deps: false
            fmt: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install GUI dependencies
        if: matrix.deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.key }}

      - name: Check formatting
        if: matrix.fmt
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

