name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the tag is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "Release tag $TAG is not a commit on main" >&2
            exit 1
          fi

      - name: Validate version
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          declared="$(git show "$TAG:build.zig.zon" | sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$declared" ]]; then
            echo "Could not read .version from build.zig.zon" >&2
            exit 1
          fi
          if [[ "$version" != "$declared" ]]; then
            echo "Tag version $version does not match build.zig.zon version $declared" >&2
            exit 1
          fi
          cli="$(git show "$TAG:cli.zon" | sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$cli" ]]; then
            echo "Could not read .version from cli.zon" >&2
            exit 1
          fi
          if [[ "$cli" != "$declared" ]]; then
            echo "cli.zon version $cli does not match build.zig.zon version $declared" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: windows-2022
            os: windows
            arch: x86_64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: macos-15
            os: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Cache Zig
        uses: actions/cache@v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            ~/AppData/Local/zig
            ~/Library/Caches/zig
          key: zig-release-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-release-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Build
        run: zig build -Doptimize=fast -Dstrip=true

      - name: Package CLI (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/package-cli.sh "${{ matrix.arch }}"

      - name: Package GUI (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/package.sh "${{ matrix.arch }}"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: packaging/windows/package-cli.ps1 -Version $env:VERSION -Arch $env:ARCH

      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: packaging/windows/package.ps1 -Version $env:VERSION -Arch $env:ARCH

      - name: Package CLI (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/package-cli.sh "${{ matrix.arch }}"

      - name: Package GUI (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/package.sh "${{ matrix.arch }}"

      - name: Upload CLI assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: zig-out/bundle/${{ matrix.os }}/*-cli-*
          if-no-files-found: error
          retention-days: 7

      - name: Upload GUI assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-gui-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            zig-out/bundle/${{ matrix.os }}/*
            !zig-out/bundle/${{ matrix.os }}/*-cli-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2.6.2
        with:
          name: kocr v${{ needs.validate.outputs.version }}
          tag_name: ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | GUI | CLI |
            | --- | --- | --- |
            | Linux x86_64 | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-linux-amd64.tar.gz) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-linux-amd64.tar.gz) |
            | Linux ARM64 | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-linux-arm64.tar.gz) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-linux-arm64.tar.gz) |
            | Windows x86_64 | [setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-windows-x86_64-setup.exe) | [zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-windows-x86_64.zip) |
            | Windows ARM64 | [setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-windows-arm64-setup.exe) | [zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-windows-arm64.zip) |
            | macOS x86_64 | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-macos-x86_64.dmg) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-macos-x86_64.tar.gz) |
            | macOS ARM64 | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-macos-arm64.dmg) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-macos-arm64.tar.gz) |

            GUI on Linux:

            ```sh
            tar -xzf kocr-${{ needs.validate.outputs.version }}-linux-amd64.tar.gz
            cd kocr-${{ needs.validate.outputs.version }}
            ./setup.sh
            ```

            Windows: run the setup executable.

            macOS: open the dmg, then drag `kocr.app` to Applications. It is unsigned: allow it in System Settings → Privacy & Security.

            CLI:

            ```sh
            tar -xzf kocr-cli-${{ needs.validate.outputs.version }}-linux-amd64.tar.gz
            install -Dm755 kocr-cli-${{ needs.validate.outputs.version }}/bin/kocr ~/.local/bin/kocr
            ```

            Windows: extract the zip and put `kocr.exe` on your `PATH`.

            macOS: extract the tarball and put `kocr` on your `PATH`.

            Arch Linux: the AUR package consumes the Linux GUI and CLI tarballs.
          files: |
            artifacts/*
