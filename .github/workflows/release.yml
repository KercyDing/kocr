name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the tag is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "Release tag $TAG is not a commit on main" >&2
            exit 1
          fi

      - name: Validate version
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          declared="$(git show "$TAG:build.zig.zon" | sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$declared" ]]; then
            echo "Could not read .version from build.zig.zon" >&2
            exit 1
          fi
          if [[ "$version" != "$declared" ]]; then
            echo "Tag version $version does not match build.zig.zon version $declared" >&2
            exit 1
          fi
          cli="$(git show "$TAG:cli.zon" | sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$cli" ]]; then
            echo "Could not read .version from cli.zon" >&2
            exit 1
          fi
          if [[ "$cli" != "$declared" ]]; then
            echo "cli.zon version $cli does not match build.zig.zon version $declared" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$TAG" == *-* ]]; then
            prerelease=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
            target: x86_64-linux-gnu
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
            target: aarch64-linux-gnu
          - runner: windows-2022
            os: windows
            arch: x86_64
            target: x86_64-windows-gnu
          - runner: windows-11-arm
            os: windows
            arch: arm64
            target: aarch64-windows-gnu
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            target: x86_64-macos
          - runner: macos-15
            os: macos
            arch: arm64
            target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Build
        run: zig build -Doptimize=fast -Dstrip=true -Dtarget=${{ matrix.target }}

      - name: Bundle
        run: zig build bundle -Doptimize=fast -Dstrip=true -Dtarget=${{ matrix.target }}

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          arch="${{ matrix.arch }}"
          mkdir -p zig-out/bundle/macos
          ditto -c -k --norsrc --noextattr --keepParent zig-out/bundle/app/kocr.app \
            "zig-out/bundle/macos/kocr-${version}-macos-${arch}.app.zip"
          rm -rf zig-out/bundle/app

      - name: Checksums (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          find zig-out/bundle -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' file; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Checksums (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          find zig-out/bundle -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' file; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem zig-out\bundle -Recurse -File |
            Where-Object { $_.Extension -ne '.sha256' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
            }

      - name: Upload assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: zig-out/bundle/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7.0.0
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2.6.2
        with:
          name: kocr v${{ needs.validate.outputs.version }}
          tag_name: ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | GUI | CLI |
            | --- | --- | --- |
            | Linux x86_64 | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr_${{ needs.validate.outputs.version }}_amd64.deb) · [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-1.x86_64.rpm) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-x86_64-linux.tar.gz) |
            | Linux ARM64 | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr_${{ needs.validate.outputs.version }}_arm64.deb) · [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-1.aarch64.rpm) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-aarch64-linux.tar.gz) |
            | Windows x86_64 | [setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr_${{ needs.validate.outputs.version }}_x86_64-setup.exe) | [zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-x86_64-windows.zip) |
            | Windows ARM64 | [setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr_${{ needs.validate.outputs.version }}_aarch64-setup.exe) | [zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-aarch64-windows.zip) |
            | macOS x86_64 | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr_${{ needs.validate.outputs.version }}_x86_64.dmg) · [app.zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-macos-x86_64.app.zip) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-x86_64-macos.tar.gz) |
            | macOS ARM64 | [dmg](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr_${{ needs.validate.outputs.version }}_aarch64.dmg) · [app.zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-${{ needs.validate.outputs.version }}-macos-arm64.app.zip) | [tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/kocr-cli-${{ needs.validate.outputs.version }}-aarch64-macos.tar.gz) |

            GUI on Linux: install the `.deb` or `.rpm` package.

            Windows: run the setup executable.

            macOS: open the dmg, then drag `kocr.app` to Applications. The app is signed but not notarized: allow it once in System Settings → Privacy & Security, and re-grant Screen Recording after each update.

            CLI:

            ```sh
            tar -xzf kocr-cli-${{ needs.validate.outputs.version }}-x86_64-linux.tar.gz
            install -Dm755 kocr ~/.local/bin/kocr
            ```

            Windows: extract the zip and put `kocr.exe` on your `PATH`.

            macOS: extract the tarball and put `kocr` on your `PATH`.

            Arch Linux: `kocr-bin` (CLI) and `kocr-gui-bin` (GUI) are on the AUR.
          files: |
            artifacts/**/*

      - name: Publish the AUR packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh workflow run aur.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"
