name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
          fi
          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on main
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tag does not point to a commit on main" >&2
            exit 1
          fi

      - name: Wait for Check
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = process.env.RELEASE_SHA;
            const workflowName = 'Check';
            const attemptsMax = 80;
            const intervalMs = 15_000;

            for (let attempt = 1; attempt <= attemptsMax; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                event: 'push',
                per_page: 20,
              });
              const runs = response.data.workflow_runs.filter((run) =>
                run.name === workflowName &&
                run.head_sha === headSha &&
                run.head_branch === 'main'
              );

              if (runs.some((run) =>
                run.status === 'completed' && run.conclusion === 'success'
              )) {
                core.info(`Commit ${headSha} passed ${workflowName}`);
                return;
              }

              const running = runs.some((run) => run.status !== 'completed');
              if (runs.length > 0 && !running) {
                const conclusions = runs
                  .map((run) => run.conclusion ?? 'unknown')
                  .join(', ');
                core.setFailed(`${workflowName} failed: ${conclusions}`);
                return;
              }

              core.info(`Waiting for ${workflowName} (${attempt}/${attemptsMax})`);
              await new Promise((resolve) => setTimeout(resolve, intervalMs));
            }

            core.setFailed(`Timed out waiting for ${workflowName}`);

      - name: Checkout release commit
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate version
        id: meta
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"

          version="${tag#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kocr-cli") | .version')"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match Cargo version $package_version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: arm64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev rpm

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package release
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bin_dir="target/${TARGET}/release"
          packaging/linux/package.sh deb kocr "$VERSION" "$TARGET" cli "$bin_dir" dist
          packaging/linux/package.sh rpm kocr "$VERSION" "$TARGET" cli "$bin_dir" dist
          packaging/linux/package.sh deb kocr-gui-qt "$VERSION" "$TARGET" qt "$bin_dir" dist
          packaging/linux/package.sh rpm kocr-gui-qt "$VERSION" "$TARGET" qt "$bin_dir" dist

          mv "dist/kocr_${VERSION}_${DEB_ARCH}.deb" \
            "dist/kocr-cli-${VERSION}-linux-${SUFFIX}.deb"
          mv "dist/kocr-${VERSION}-1.${RPM_ARCH}.rpm" \
            "dist/kocr-cli-${VERSION}-linux-${SUFFIX}.rpm"
          mv "dist/kocr-gui-qt_${VERSION}_${DEB_ARCH}.deb" \
            "dist/kocr-gui-qt-${VERSION}-linux-${SUFFIX}.deb"
          mv "dist/kocr-gui-qt-${VERSION}-1.${RPM_ARCH}.rpm" \
            "dist/kocr-gui-qt-${VERSION}-linux-${SUFFIX}.rpm"

          cli_package="kocr-${VERSION}-${TARGET}"
          mkdir -p "dist/${cli_package}"
          install -m 0755 "$bin_dir/kocr" "dist/${cli_package}/kocr"
          install -m 0644 LICENSE LICENSE-PaddleOCR NOTICE "dist/${cli_package}/"
          tar -C dist -czf "dist/${cli_package}.tar.gz" "$cli_package"
          sha256sum "dist/${cli_package}.tar.gz" > "dist/${cli_package}.tar.gz.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-gtk:
    name: Build GTK ${{ matrix.label }}
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    container: rust:trixie
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: arm64
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Install GTK
        run: |
          apt-get update
          apt-get install -y libgtk-4-dev pkg-config rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: gtk-${{ matrix.target }}

      - name: Build GTK release
        run: |
          cargo build --release --locked -p kocr-cli -p kocr-daemon
          cargo build --release --locked -p kocr-gui --no-default-features --features gtk

      - name: Package GTK
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          packaging/linux/package.sh deb kocr-gui-gtk "$VERSION" "$TARGET" gtk target/release dist
          packaging/linux/package.sh rpm kocr-gui-gtk "$VERSION" "$TARGET" gtk target/release dist

          mv "dist/kocr-gui-gtk_${VERSION}_${DEB_ARCH}.deb" \
            "dist/kocr-gui-gtk-${VERSION}-linux-${SUFFIX}.deb"
          mv "dist/kocr-gui-gtk-${VERSION}-1.${RPM_ARCH}.rpm" \
            "dist/kocr-gui-gtk-${VERSION}-linux-${SUFFIX}.rpm"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-gtk-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  build-macos-cli:
    name: CLI ${{ matrix.label }}
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - label: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p kocr-cli --target "$TARGET"

      - name: Package CLI
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="kocr-${VERSION}-${TARGET}"
          mkdir -p "dist/${package}"
          install -m 0755 "target/${TARGET}/release/kocr" "dist/${package}/kocr"
          install -m 0644 LICENSE LICENSE-PaddleOCR NOTICE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
          (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-windows-cli:
    name: CLI ${{ matrix.label }}
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p kocr-cli --target "$env:TARGET"

      - name: Package CLI
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "kocr-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/$env:TARGET/release/kocr.exe" "dist/$package/kocr.exe"
          Copy-Item LICENSE, LICENSE-PaddleOCR, NOTICE "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -Force
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package.zip" | Set-Content "dist/$package.zip.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-cli-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [validate-tag, build, build-gtk, build-macos-cli, build-windows-cli]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: kocr v${{ needs.validate-tag.outputs.version }}
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## 安装

            | 包 | x86_64 | ARM64 |
            | --- | --- | --- |
            | CLI | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-amd64.rpm) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-arm64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-arm64.rpm) |
            | GUI (Qt) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-amd64.rpm) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-arm64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-arm64.rpm) |
            | GUI (GTK) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-amd64.rpm) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-arm64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-arm64.rpm) |
            | CLI macOS | [Intel](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-x86_64-apple-darwin.tar.gz) | [Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-aarch64-apple-darwin.tar.gz) |
            | CLI Windows | [x86_64](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-x86_64-pc-windows-msvc.zip) | [ARM64](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-aarch64-pc-windows-msvc.zip) |

            Arch Linux：

            ```sh
            paru -S kocr-bin        # CLI
            paru -S kocr-qt-bin     # GUI, Qt
            paru -S kocr-gtk-bin    # GUI, GTK
            ```

            GUI 包不包含 CLI。首次打开 KOCR Settings 后安装模型并启用快捷键。
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish-aur:
    name: Publish AUR
    needs: [validate-tag, release]
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ needs.validate-tag.outputs.tag }}
    secrets: inherit
