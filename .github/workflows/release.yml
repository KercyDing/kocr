name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.tag.outputs.tag }}
      linux_qt: ${{ steps.matrix.outputs.linux_qt }}
      linux_gtk: ${{ steps.matrix.outputs.linux_gtk }}
      macos_cli: ${{ steps.matrix.outputs.macos_cli }}
      windows_cli: ${{ steps.matrix.outputs.windows_cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load build matrix
        id: matrix
        run: python3 scripts/ci/matrix.py >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
          fi
          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on main
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Release tag does not point to a commit on main" >&2
            exit 1
          fi

      - name: Wait for Check
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = process.env.RELEASE_SHA;
            const workflowName = 'Check';
            const attemptsMax = 80;
            const intervalMs = 15_000;

            for (let attempt = 1; attempt <= attemptsMax; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                event: 'push',
                per_page: 20,
              });
              const runs = response.data.workflow_runs.filter((run) =>
                run.name === workflowName &&
                run.head_sha === headSha &&
                run.head_branch === 'main'
              );

              if (runs.some((run) =>
                run.status === 'completed' && run.conclusion === 'success'
              )) {
                core.info(`Commit ${headSha} passed ${workflowName}`);
                return;
              }

              const running = runs.some((run) => run.status !== 'completed');
              if (runs.length > 0 && !running) {
                const conclusions = runs
                  .map((run) => run.conclusion ?? 'unknown')
                  .join(', ');
                core.setFailed(`${workflowName} failed: ${conclusions}`);
                return;
              }

              core.info(`Waiting for ${workflowName} (${attempt}/${attemptsMax})`);
              await new Promise((resolve) => setTimeout(resolve, intervalMs));
            }

            core.setFailed(`Timed out waiting for ${workflowName}`);

      - name: Checkout release commit
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate version
        id: meta
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"

          version="${tag#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "kocr-cli") | .version')"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match Cargo version $package_version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-tag.outputs.linux_qt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: qt-${{ matrix.asset_key }}

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev rpm

      - name: Build release
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p kocr-cli -p kocr-gui -p kocr-daemon

      - name: Package CLI
        uses: ./.github/actions/package-linux
        with:
          package: kocr-cli
          version: ${{ needs.validate-tag.outputs.version }}
          target: ${{ matrix.target }}
          backend: cli
          bin-dir: target/${{ matrix.target }}/release
          suffix: ${{ matrix.suffix }}
          deb-arch: ${{ matrix.deb_arch }}
          rpm-arch: ${{ matrix.rpm_arch }}

      - name: Package Qt
        uses: ./.github/actions/package-linux
        with:
          package: kocr-gui-qt
          version: ${{ needs.validate-tag.outputs.version }}
          target: ${{ matrix.target }}
          backend: qt
          bin-dir: target/${{ matrix.target }}/release
          suffix: ${{ matrix.suffix }}
          deb-arch: ${{ matrix.deb_arch }}
          rpm-arch: ${{ matrix.rpm_arch }}

      - name: Package CLI tar
        uses: ./.github/actions/package-cli-tar
        with:
          version: ${{ needs.validate-tag.outputs.version }}
          target: ${{ matrix.target }}
          bin-dir: target/${{ matrix.target }}/release

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_key }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-gtk:
    name: Build ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.platform }}
    container: rust:trixie
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-tag.outputs.linux_gtk) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Install GTK
        run: |
          apt-get update
          apt-get install -y libgtk-4-dev pkg-config rpm

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: gtk-${{ matrix.asset_key }}

      - name: Build GTK release
        run: |
          cargo build --release --locked -p kocr-daemon
          cargo build --release --locked -p kocr-gui --no-default-features --features gtk

      - name: Package GTK
        uses: ./.github/actions/package-linux
        with:
          package: kocr-gui-gtk
          version: ${{ needs.validate-tag.outputs.version }}
          target: ${{ matrix.target }}
          backend: gtk
          bin-dir: target/release
          suffix: ${{ matrix.suffix }}
          deb-arch: ${{ matrix.deb_arch }}
          rpm-arch: ${{ matrix.rpm_arch }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_key }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  build-macos-cli:
    name: Build ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-tag.outputs.macos_cli) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: cli-${{ matrix.asset_key }}

      - name: Build CLI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p kocr-cli --target "$TARGET"

      - name: Package CLI tar
        uses: ./.github/actions/package-cli-tar
        with:
          version: ${{ needs.validate-tag.outputs.version }}
          target: ${{ matrix.target }}
          bin-dir: target/${{ matrix.target }}/release

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_key }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-windows-cli:
    name: Build ${{ matrix.name }}
    needs: validate-tag
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-tag.outputs.windows_cli) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: cli-${{ matrix.asset_key }}

      - name: Build CLI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p kocr-cli --target "$env:TARGET"

      - name: Package CLI
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "kocr-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/$env:TARGET/release/kocr.exe" "dist/$package/kocr.exe"
          Copy-Item LICENSE, LICENSE-PaddleOCR, NOTICE "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -Force
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package.zip" | Set-Content "dist/$package.zip.sha256"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_key }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [validate-tag, build, build-gtk, build-macos-cli, build-windows-cli]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: kocr v${{ needs.validate-tag.outputs.version }}
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Installation

            | Package | x86_64 | ARM64 |
            | --- | --- | --- |
            | CLI | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-amd64.rpm) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-arm64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-cli-${{ needs.validate-tag.outputs.version }}-linux-arm64.rpm) |
            | GUI (Qt) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-amd64.rpm) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-arm64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-qt-${{ needs.validate-tag.outputs.version }}-linux-arm64.rpm) |
            | GUI (GTK) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-amd64.rpm) | [deb](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-arm64.deb) / [rpm](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-gui-gtk-${{ needs.validate-tag.outputs.version }}-linux-arm64.rpm) |
            | CLI macOS | [Intel](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-x86_64-apple-darwin.tar.gz) | [Apple Silicon](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-aarch64-apple-darwin.tar.gz) |
            | CLI Windows | [x86_64](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-x86_64-pc-windows-msvc.zip) | [ARM64](https://github.com/${{ github.repository }}/releases/download/${{ needs.validate-tag.outputs.tag }}/kocr-${{ needs.validate-tag.outputs.version }}-aarch64-pc-windows-msvc.zip) |

            Arch Linux:

            ```sh
            paru -S kocr-bin        # CLI
            paru -S kocr-qt-bin     # GUI, Qt
            paru -S kocr-gtk-bin    # GUI, GTK
            ```

            GUI packages do not include the CLI. Open KOCR Settings to install a model and enable shortcuts.
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish-aur:
    name: Publish AUR
    needs: [validate-tag, release]
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ needs.validate-tag.outputs.tag }}
    secrets: inherit
