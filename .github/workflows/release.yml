name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Cache Zig
        uses: actions/cache@v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build CLI
        run: zig build -Doptimize=fast -Dstrip=true

      - name: Package CLI
        run: |
          mkdir -p dist-cli
          cp zig-out/bin/kocr README.md LICENSE dist-cli/
          tar -C dist-cli -czf kocr-cli-linux-${{ matrix.arch }}.tar.gz .

      - name: Inspect CLI
        run: |
          file zig-out/bin/kocr
          tar -tzf kocr-cli-linux-${{ matrix.arch }}.tar.gz

      - name: Upload CLI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-cli-linux-${{ matrix.arch }}
          path: kocr-cli-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-private-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Cache Zig
        uses: actions/cache@v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build GUI
        run: zig build gui -Doptimize=fast -Dstrip=true

      - name: Package GUI
        run: |
          mkdir -p dist-gui
          cp zig-out/bin/kocr-gui README.md LICENSE dist-gui/
          tar -C dist-gui -czf kocr-linux-${{ matrix.arch }}.tar.gz .

      - name: Inspect GUI
        run: |
          file zig-out/bin/kocr-gui
          tar -tzf kocr-linux-${{ matrix.arch }}.tar.gz

      - name: Upload GUI
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-linux-${{ matrix.arch }}
          path: kocr-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7
