name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: windows-2022
            os: windows
            arch: x86_64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: macos-15
            os: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Cache Zig
        uses: actions/cache@v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            ~/AppData/Local/zig
            ~/Library/Caches/zig
          key: zig-release-cli-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-release-cli-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Build CLI
        run: zig build -Doptimize=fast -Dstrip=true

      - name: Package CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-cli
          cp zig-out/bin/kocr README.md LICENSE dist-cli/
          tar -C dist-cli -czf kocr-cli-linux-${{ matrix.arch }}.tar.gz .
          file zig-out/bin/kocr
          tar -tzf kocr-cli-linux-${{ matrix.arch }}.tar.gz

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path zig-out/bin/kocr.exe, README.md, LICENSE -DestinationPath kocr-cli-windows-${{ matrix.arch }}.zip
          Get-Item zig-out/bin/kocr.exe | Select-Object Name, Length

      - name: Package CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-cli
          cp zig-out/bin/kocr README.md LICENSE dist-cli/
          tar -C dist-cli -czf kocr-cli-macos-${{ matrix.arch }}.tar.gz .
          file zig-out/bin/kocr
          tar -tzf kocr-cli-macos-${{ matrix.arch }}.tar.gz

      - name: Upload CLI (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-cli-linux-${{ matrix.arch }}
          path: kocr-cli-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload CLI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-cli-windows-${{ matrix.arch }}
          path: kocr-cli-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload CLI (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-cli-macos-${{ matrix.arch }}
          path: kocr-cli-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: windows-2022
            os: windows
            arch: x86_64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: macos-15
            os: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Cache Zig
        uses: actions/cache@v6.1.0
        with:
          path: |
            .zig-cache
            ~/.cache/zig
            ~/AppData/Local/zig
            ~/Library/Caches/zig
          key: zig-release-gui-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-release-gui-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Build GUI
        run: zig build gui -Doptimize=fast -Dstrip=true

      - name: Package GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-gui/bin
          cp zig-out/bin/kocr-gui dist-gui/bin/
          cp README.md LICENSE dist-gui/
          install -D -m 0644 packaging/linux/kocr-gui.desktop dist-gui/share/applications/kocr-gui.desktop
          install -D -m 0644 src/gui/icons/linux/16.png dist-gui/share/icons/hicolor/16x16/apps/kocr.png
          install -D -m 0644 src/gui/icons/linux/32.png dist-gui/share/icons/hicolor/32x32/apps/kocr.png
          install -D -m 0644 src/gui/icons/linux/128.png dist-gui/share/icons/hicolor/128x128/apps/kocr.png
          install -D -m 0644 src/gui/icons/linux/256.png dist-gui/share/icons/hicolor/256x256/apps/kocr.png
          install -D -m 0644 src/gui/icons/linux/512.png dist-gui/share/icons/hicolor/512x512/apps/kocr.png
          tar -C dist-gui -czf kocr-gui-linux-${{ matrix.arch }}.tar.gz .
          file zig-out/bin/kocr-gui
          tar -tzf kocr-gui-linux-${{ matrix.arch }}.tar.gz

      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path zig-out/bin/kocr-gui.exe, README.md, LICENSE -DestinationPath kocr-gui-windows-${{ matrix.arch }}.zip
          Get-Item zig-out/bin/kocr-gui.exe | Select-Object Name, Length

      - name: Package GUI (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/package.sh "${{ matrix.arch }}" dist-gui
          ls -la dist-gui

      - name: Upload GUI (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-gui-linux-${{ matrix.arch }}
          path: kocr-gui-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload GUI (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-gui-windows-${{ matrix.arch }}
          path: kocr-gui-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload GUI (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kocr-gui-macos-${{ matrix.arch }}
          path: dist-gui/kocr-gui-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
