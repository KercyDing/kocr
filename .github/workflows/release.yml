name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"

      - name: Build CLI
        run: zig build -Doptimize=fast -Dstrip=true

      - name: Package CLI
        run: |
          mkdir -p dist-cli
          cp zig-out/bin/kocr README.md LICENSE dist-cli/
          tar -C dist-cli -czf kocr-cli-linux-x86_64.tar.gz .

      - name: Inspect CLI
        run: |
          file zig-out/bin/kocr
          tar -tzf kocr-cli-linux-x86_64.tar.gz

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: kocr-cli-linux-x86_64
          path: kocr-cli-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  gui:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-private-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"

      - name: Build GUI
        run: zig build gui -Doptimize=fast -Dstrip=true

      - name: Package GUI
        run: |
          mkdir -p dist-gui
          cp zig-out/bin/kocr-gui README.md LICENSE dist-gui/
          tar -C dist-gui -czf kocr-gui-linux-x86_64.tar.gz .

      - name: Inspect GUI
        run: |
          file zig-out/bin/kocr-gui
          tar -tzf kocr-gui-linux-x86_64.tar.gz

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: kocr-gui-linux-x86_64
          path: kocr-gui-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
