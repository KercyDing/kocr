[package]
name = "kocr"
version = "0.3.3"
edition = "2024"
description = "An offline OCR tool"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "kocr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
futures-util = "0.3"
rusto-rs = { version = "0.3.2", default-features = false }
tempfile = "3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
zbus = "6"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
