[package]
name = "kdeocr"
version = "0.3.1"
edition = "2024"
description = "An offline OCR tool for KDE Plasma 6 on Wayland"
license = "Apache-2.0"
autobins = false

[[bin]]
name = "kocr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
futures-util = "0.3"
rusto-rs = { version = "0.3.2", default-features = false }
tempfile = "3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
toml = "1"
ruzstd = "0.9"
thiserror = "2"
zbus = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
