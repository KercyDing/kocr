[workspace]
members = [
    "kocr-cli",
    "kocr-config",
    "kocr-core",
    "kocr-daemon",
    "kocr-gui",
    "kocr-model",
    "kocr-ocr",
    "kocr-platform",
]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/KercyDing/kocr"

[workspace.dependencies]
kocr-config = { path = "kocr-config" }
kocr-core = { path = "kocr-core" }
kocr-model = { path = "kocr-model" }
kocr-ocr = { path = "kocr-ocr" }
kocr-platform = { path = "kocr-platform" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
dirs = "7"
futures-util = "0.3"
global-hotkey = "0.9"
rusto-rs = { version = "0.3.2", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = "3"
winio = { version = "=0.13.0-beta.2", default-features = false }
zbus = "6"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
