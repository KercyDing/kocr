[workspace]
members = [
    "kocr-cli",
    "kocr-config",
    "kocr-core",
    "kocr-shortcuts",
    "kocr-gui",
    "kocr-model",
    "kocr-ocr",
    "kocr-platform",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/KercyDing/kocr"

[workspace.dependencies]
kocr-config = { path = "kocr-config" }
kocr-core = { path = "kocr-core" }
kocr-shortcuts = { path = "kocr-shortcuts" }
kocr-model = { path = "kocr-model" }
kocr-ocr = { path = "kocr-ocr" }
kocr-platform = { path = "kocr-platform" }

anyhow = "1"
auto-launch = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
dirs = "7"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
xcap = { version = "0.9", features = ["image"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
futures-util = "0.3"
global-hotkey = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
rust-i18n = "4.2.4"
rusto-rs = { version = "0.3", default-features = false }
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
tray-icon = { version = "0.26", default-features = false, features = ["libappindicator"] }
ureq = "3"
winit = { version = "0.30", default-features = false, features = ["x11"] }
zbus = "6"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
