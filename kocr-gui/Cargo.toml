[package]
name = "kocr-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop app for kocr"
autobins = false

[[bin]]
name = "kocr-gui"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
eframe.workspace = true
kocr-config.workspace = true
kocr-core.workspace = true
kocr-model.workspace = true
kocr-shortcuts.workspace = true
rusqlite.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
winit = { version = "0.30", default-features = false, features = ["x11"] }
